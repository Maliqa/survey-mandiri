name: Backend CI

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-*.yml"]
  push:
    branches: ["**"]
    paths: ["backend/**", ".github/workflows/backend-*.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations are up to date
        run: DJANGO_SETTINGS_MODULE=config.settings_test python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL)
        run: python -m pytest
